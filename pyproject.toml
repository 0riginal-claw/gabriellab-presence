[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "gabriellab-presence"
version = "0.0.1"
description = "Lab identity beacon for gabriellab — prints identity JSON on import/run."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["gabriellab", "presence", "identity"]

[project.scripts]
gabriellab-presence = "gabriellab_presence:main"

[tool.setuptools.packages.find]
where = ["src"]
